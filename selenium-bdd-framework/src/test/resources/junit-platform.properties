cucumber.publish.quiet=true

# Plugins: pretty console + Cucumber HTML/JSON + Allure + Extent adapter
cucumber.plugin=pretty, \
  html:reports/cucumber-html-report.html, \
  json:reports/cucumber-report.json, \
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, \
  com.aventstack.extentreports.cucumber.adapter.ExtentCucumberAdapter:

cucumber.glue=com.eventhub.framework.hooks,com.eventhub.framework.stepdefinitions
cucumber.filter.tags=not @Ignore

# Parallel execution (feature-level parallelism)
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1.0
cucumber.execution.exclusive-resources.default.read-write=default
