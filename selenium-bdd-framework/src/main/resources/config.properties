## ==========================================================
## Global framework configuration (defaults - overridden by
## environment-specific files in src/main/resources/environments)
## ==========================================================

# Active environment: qa | dev | staging
env=qa

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30
script.timeout=30

# Parallel execution
parallel.execution=false
thread.count=3

# Reporting
screenshot.on.failure=true
screenshot.path=screenshots/
report.path=reports/
log.path=logs/

# Retry
retry.count=1
